[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pycadu"
version = "0.1.0"
description = "Satellite-agnostic CCSDS/CADU/VCDU frame handling"
readme = "README.rst"
requires-python = ">=3.14"
license = "GPL-3.0-or-later"
authors = [
  { name = "Martin Raspaud", email = "martin.raspaud@smhi.se" },
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
  "Operating System :: OS Independent",
  "Programming Language :: Python",
  "Topic :: Scientific/Engineering",
]
dependencies = [
  "numpy>=2.0",
]

[project.urls]
Source = "https://github.com/mraspaud/pycadu"
Issues = "https://github.com/mraspaud/pycadu/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/pycadu"]

[tool.uv]
cache-dir = ".uv-cache"

[dependency-groups]
dev = [
  "pytest>=9.0",
  "basedpyright>=1.0",
  "ruff>=0.9",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "RUF"]
